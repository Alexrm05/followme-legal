<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the convoy · FollowMe</title>
<meta property="og:title" content="Join my convoy on FollowMe">
<meta property="og:description" content="Tap to open FollowMe and follow the leader's route.">
<style>
:root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --card:#f5f5f7; --accent:#0a66d8; }
@media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f5f5f7; --muted:#a1a1a6; --card:#1c1c1e; --accent:#4c9dff; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
main { max-width:440px; margin:0 auto; padding:48px 16px; text-align:center; }
.logo { width:72px; height:72px; margin:0 auto 16px; border-radius:18px; background:linear-gradient(135deg,#1e88e5,#3949ab); display:grid; place-items:center; font-size:36px; }
h1 { font-size:26px; margin:0 0 8px; }
p { color:var(--muted); margin:8px 0; }
.code { font:700 40px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:6px; margin:24px 0; padding:18px; background:var(--card); border-radius:16px; }
.open { display:block; padding:16px; border-radius:14px; background:var(--accent); color:#fff; font-weight:600; text-decoration:none; }
small { display:block; margin-top:28px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="logo">🚗</div>
  <h1 id="title">Join the convoy</h1>
  <p id="lead">Open FollowMe to follow the leader's route.</p>
  <div class="code" id="code">······</div>
  <a class="open" id="open" href="#">Open FollowMe</a>
  <small id="help">Don't have the app yet? Ask the leader for the test invitation, then enter this code in FollowMe.</small>
</main>
<script>
(function () {
  var m = /[?&#]c=([A-Za-z0-9]{6})/.exec(location.search + location.hash);
  var code = m ? m[1].toUpperCase() : "";
  var es = (navigator.language || "").toLowerCase().indexOf("es") === 0;
  if (es) {
    document.documentElement.lang = "es";
    document.title = "Únete a la caravana · FollowMe";
    document.getElementById("title").textContent = "Únete a la caravana";
    document.getElementById("lead").textContent = "Abre FollowMe para seguir el camino del líder.";
    document.getElementById("open").textContent = "Abrir FollowMe";
    document.getElementById("help").textContent = "¿Aún no tienes la app? Pide al líder la invitación de prueba y luego escribe este código en FollowMe.";
  }
  if (!code) return;
  document.getElementById("code").textContent = code;
  var android = /android/i.test(navigator.userAgent);
  var url = android
    ? "intent://join/" + code + "#Intent;scheme=followme;package=com.followmeconvoy.app;end"
    : "followme://join/" + code;
  var open = document.getElementById("open");
  open.href = url;
  // Try to open the app straight away; the button stays for browsers that block it.
  setTimeout(function () { location.href = url; }, 300);
})();
</script>
</body>
</html>
